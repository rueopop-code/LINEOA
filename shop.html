<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maejai Shop — ร้านค้าออนไลน์</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --line: #06C755;
    --line-dark: #04a045;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #6e6e73;
    --border: #d2d2d7;
    --radius: 12px;
  }
  body { font-family: 'Segoe UI', -apple-system, 'Noto Sans Thai', sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Header ── */
  header {
    background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    padding: 0 24px;
  }
  .header-inner { max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .logo { font-size: 20px; font-weight: 700; color: var(--text); }
  .logo span { color: var(--line); }
  .cart-btn {
    background: var(--line); color: #fff; border: none; border-radius: 20px;
    padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .15s;
  }
  .cart-btn:hover { background: var(--line-dark); }
  .cart-badge {
    background: #fff; color: var(--line); border-radius: 50%;
    width: 20px; height: 20px; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Layout ── */
  .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

  /* ── Products ── */
  .section-label { font-size: 13px; font-weight: 600; color: var(--sub);
    letter-spacing: .8px; text-transform: uppercase; margin-bottom: 14px; }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
  .product-card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .product-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .product-img { height: 100px; display: flex; align-items: center; justify-content: center;
    font-size: 42px; background: #f0f0f5; }
  .product-body { padding: 10px 12px 12px; }
  .product-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .product-desc { font-size: 11px; color: var(--sub); margin-top: 2px; line-height: 1.4; }
  .product-price { font-size: 15px; font-weight: 700; color: var(--line); margin-top: 6px; }
  .add-btn {
    width: 100%; margin-top: 8px; padding: 6px 0;
    border: 1.5px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--line); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .add-btn:hover, .add-btn.active { background: var(--line); color: #fff; border-color: var(--line); }

  /* ── Cart Panel ── */
  .cart-panel {
    background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
    position: sticky; top: 80px; overflow: hidden;
  }
  .cart-head { padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .cart-head-icon { font-size: 18px; }
  .cart-body { max-height: 300px; overflow-y: auto; }
  .cart-empty-msg { padding: 32px 16px; text-align: center; color: var(--sub); font-size: 13px; }
  .cart-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid #f0f0f0;
  }
  .ci-emoji { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-price { font-size: 11px; color: var(--sub); margin-top: 1px; }
  .qty-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .qty-btn {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg); cursor: pointer; font-size: 15px; display: flex;
    align-items: center; justify-content: center; transition: background .1s;
  }
  .qty-btn:hover { background: #e0e0e5; }
  .qty-num { font-size: 13px; font-weight: 600; min-width: 18px; text-align: center; }
  .cart-foot { padding: 14px 16px; }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .total-label { font-size: 13px; color: var(--sub); }
  .total-amt { font-size: 20px; font-weight: 700; }

  .form-group { margin-bottom: 10px; }
  .form-group label { font-size: 11px; font-weight: 600; color: var(--sub);
    display: block; margin-bottom: 4px; letter-spacing: .3px; }
  .form-group input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--bg);
    color: var(--text); transition: border-color .15s;
  }
  .form-group input:focus { outline: none; border-color: var(--line); background: #fff; }
  .form-group small { font-size: 10px; color: var(--sub); margin-top: 3px; display: block; }

  .confirm-btn {
    width: 100%; padding: 12px 0; background: var(--line); color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--line-dark); }
  .confirm-btn:disabled { background: #ccc; cursor: not-allowed; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card); border-radius: 20px; padding: 28px 24px;
    width: 320px; max-width: 90vw; text-align: center;
    transform: scale(.92); transition: transform .2s;
  }
  .modal-overlay.show .modal { transform: scale(1); }
  .modal-icon { font-size: 48px; margin-bottom: 10px; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--sub); line-height: 1.6; }
  .order-preview {
    background: #e8f8ee; border: 1px solid #b2dfca; border-radius: 10px;
    padding: 12px; margin: 14px 0; text-align: left;
    font-size: 12px; color: #1a5c36; line-height: 1.7; white-space: pre-line;
  }
  .modal-close {
    display: inline-block; margin-top: 8px; padding: 10px 32px;
    background: var(--line); color: #fff; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .modal-close:hover { background: var(--line-dark); }
  .spinner {
    width: 40px; height: 40px; border: 3px solid #e0e0e0;
    border-top-color: var(--line); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Maejai<span>Shop</span></div>
    <button class="cart-btn" onclick="scrollToCart()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
           viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      ตะกร้า <span class="cart-badge" id="cart-count">0</span>
    </button>
  </div>
</header>

<div class="page">
  <div class="layout">

    <!-- ─── Products ─────────────────────────── -->
    <div>
      <div class="section-label">สินค้าทั้งหมด</div>
      <div class="products-grid" id="products-grid"></div>
    </div>

    <!-- ─── Cart ─────────────────────────────── -->
    <div class="cart-panel" id="cart-panel">
      <div class="cart-head"><span class="cart-head-icon">🛒</span> ตะกร้าสินค้า</div>
      <div class="cart-body" id="cart-body">
        <div class="cart-empty-msg">ยังไม่มีสินค้าในตะกร้า<br>เลือกสินค้าทางซ้ายเลยค่ะ</div>
      </div>
      <div class="cart-foot">
        <div class="total-row">
          <span class="total-label">ยอดรวม</span>
          <span class="total-amt" id="cart-total">฿0</span>
        </div>

        <div class="form-group">
          <label>ชื่อผู้สั่ง</label>
          <input type="text" id="customer-name" placeholder="กรอกชื่อของคุณ">
        </div>

        <div class="form-group">
          <label>LINE User ID</label>
          <input type="text" id="line-uid" placeholder="Uxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
          <small>Add Friend กับ LINE OA แล้วพิมพ์ "id" เพื่อรับ User ID ค่ะ</small>
        </div>

        <button class="confirm-btn" id="confirm-btn" onclick="submitOrder()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          ส่งออเดอร์ไป LINE OA
        </button>
      </div>
    </div>

  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box"></div>
</div>

<script>
// ══════════════════════════════════════════════
//  CONFIG — เปลี่ยนเป็น URL ของ backend จริง
// ══════════════════════════════════════════════
const BACKEND_URL = 'https://YOUR-APP.up.railway.app'; // ← เปลี่ยนตรงนี้!

// ══════════════════════════════════════════════
//  Data
// ══════════════════════════════════════════════
const products = [
  { id:1, name:'กาแฟดอยช้าง',   emoji:'☕', price:120, desc:'อาราบิก้า 100% จากเชียงราย' },
  { id:2, name:'ชาอู่หลง',       emoji:'🍵', price:85,  desc:'ชาจากดอยแม่สลอง' },
  { id:3, name:'น้ำผึ้งป่า',     emoji:'🍯', price:180, desc:'น้ำผึ้งธรรมชาติ 100%' },
  { id:4, name:'ข้าวไรซ์เบอรี่', emoji:'🌾', price:65,  desc:'ข้าวอินทรีย์จากเชียงราย' },
  { id:5, name:'มะขามหวาน',     emoji:'🟤', price:55,  desc:'มะขามอบแห้งสูตรโบราณ' },
  { id:6, name:'สบู่ดอกคำฝอย', emoji:'🧼', price:95,  desc:'สูตรสมุนไพรธรรมชาติ' },
  { id:7, name:'น้ำมันมะพร้าว', emoji:'🥥', price:145, desc:'สกัดเย็น Extra Virgin' },
  { id:8, name:'กล้วยอบแห้ง',   emoji:'🍌', price:45,  desc:'ไม่มีน้ำตาลเพิ่ม' },
];

let cart = {}; // { id: { ...product, qty } }

// ══════════════════════════════════════════════
//  Render
// ══════════════════════════════════════════════
function renderProducts() {
  document.getElementById('products-grid').innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-img">${p.emoji}</div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.desc}</div>
        <div class="product-price">฿${p.price.toLocaleString()}</div>
        <button class="add-btn" id="btn-${p.id}" onclick="addToCart(${p.id})">+ ใส่ตะกร้า</button>
      </div>
    </div>
  `).join('');
}

function renderCart() {
  const items = Object.values(cart).filter(x => x.qty > 0);
  const total = items.reduce((s, x) => s + x.price * x.qty, 0);
  const count = items.reduce((s, x) => s + x.qty, 0);

  document.getElementById('cart-count').textContent = count;
  document.getElementById('cart-total').textContent = '฿' + total.toLocaleString();

  const body = document.getElementById('cart-body');
  if (!items.length) {
    body.innerHTML = '<div class="cart-empty-msg">ยังไม่มีสินค้าในตะกร้า<br>เลือกสินค้าทางซ้ายเลยค่ะ</div>';
  } else {
    body.innerHTML = items.map(item => `
      <div class="cart-item">
        <span class="ci-emoji">${item.emoji}</span>
        <div class="ci-info">
          <div class="ci-name">${item.name}</div>
          <div class="ci-price">฿${item.price} × ${item.qty} = ฿${(item.price*item.qty).toLocaleString()}</div>
        </div>
        <div class="qty-wrap">
          <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
        </div>
      </div>
    `).join('');
  }

  // sync add-btn states
  products.forEach(p => {
    const btn = document.getElementById('btn-'+p.id);
    if (!btn) return;
    const inCart = cart[p.id]?.qty > 0;
    btn.textContent = inCart ? `✓ อยู่ในตะกร้า (${cart[p.id].qty})` : '+ ใส่ตะกร้า';
    btn.classList.toggle('active', inCart);
  });
}

// ══════════════════════════════════════════════
//  Cart Actions
// ══════════════════════════════════════════════
function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!cart[id]) cart[id] = { ...p, qty: 0 };
  cart[id].qty++;
  renderCart();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty = Math.max(0, cart[id].qty + delta);
  renderCart();
}

function scrollToCart() {
  document.getElementById('cart-panel').scrollIntoView({ behavior: 'smooth' });
}

// ══════════════════════════════════════════════
//  Submit Order
// ══════════════════════════════════════════════
async function submitOrder() {
  const items = Object.values(cart).filter(x => x.qty > 0);
  if (!items.length) { alert('กรุณาเลือกสินค้าก่อนค่ะ'); return; }

  const customerName = document.getElementById('customer-name').value.trim();
  const userId       = document.getElementById('line-uid').value.trim();
  const total        = items.reduce((s, x) => s + x.price * x.qty, 0);

  if (!customerName) { alert('กรุณากรอกชื่อผู้สั่ง'); return; }
  if (!userId)        { alert('กรุณากรอก LINE User ID'); return; }

  showModal('loading');

  try {
    const res = await fetch(`${BACKEND_URL}/send-order`, {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify({
        userId,
        customerName,
        items: items.map(({ name, emoji, price, qty }) => ({ name, emoji, price, qty })),
        total
      })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      showModal('success', data.orderId);
      cart = {};
      renderCart();
    } else {
      showModal('error', null, data.error || 'เกิดข้อผิดพลาด');
    }
  } catch (e) {
    showModal('error', null, 'เชื่อมต่อ Backend ไม่ได้ กรุณาตรวจสอบ URL');
  }
}

// ══════════════════════════════════════════════
//  Modal
// ══════════════════════════════════════════════
function showModal(type, orderId = '', errMsg = '') {
  const box = document.getElementById('modal-box');
  const ov  = document.getElementById('modal-overlay');

  if (type === 'loading') {
    box.innerHTML = `<div class="spinner"></div>
      <div class="modal-title">กำลังส่งออเดอร์...</div>
      <div class="modal-sub">กำลังส่งข้อความไป LINE OA ค่ะ</div>`;
  } else if (type === 'success') {
    box.innerHTML = `
      <div class="modal-icon">🎉</div>
      <div class="modal-title">ส่งออเดอร์สำเร็จ!</div>
      <div class="modal-sub">ออเดอร์ #${orderId} ถูกส่งไปยัง LINE OA แล้วค่ะ<br>รอร้านค้าติดต่อกลับนะคะ</div>
      <button class="modal-close" onclick="closeModal()">ตกลง</button>`;
  } else {
    box.innerHTML = `
      <div class="modal-icon">❌</div>
      <div class="modal-title">ส่งไม่สำเร็จ</div>
      <div class="modal-sub">${errMsg}</div>
      <button class="modal-close" onclick="closeModal()">ลองใหม่</button>`;
  }

  ov.classList.add('show');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
}

// ══════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════
renderProducts();
</script>
</body>
</html>
